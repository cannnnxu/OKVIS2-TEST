%YAML:1.0
---
cameras:
     - {T_SC: 
            # [-0.01869892, -0.99972806, -0.01393425 ,0.00726963,
            # -0.26811017, 0.01844002 ,-0.96321177, -0.02981797,
            # 0.96320677, -0.01427511,-0.26838206, -0.13239794,
            # 0., 0., 0. ,1. ],
            [-0.01039363,   0.99994595,  0.00027614, -0.27939175,
           -0.99982944, -0.0103882,  -0.01527021, 0.00394073,
           -0.01526652,  -0.00043481, 0.99988337, -0.00039529,
           0, 0, 0, 1],
        image_dimension: [1440, 1080],
        distortion_type: equidistant,
        distortion_coefficients: [-0.0764245,  0.0322856 ,-0.0445168,0.0163317],
        focal_length: [829.224, 829.454],
        principal_point: [ 833.937, 562.509],
        cam_model: pinhole,
        camera_type: gray, #gray, rgb, gray+depth, rgb+depth
        mapping: false,
        mapping_rectification: false,
        slam_use: okvis} #none, okvis, okvis-depth, okvis-virtual

# T_ci: (imu0 to cam0):

# T_ic: (cam0 to imu0):
# [[-0.01869892 -0.26811017 0.96320677 0.11966802]
# [-0.99972806 0.01844002 -0.01427511 0.0059275 ]
# [-0.01393425 -0.96321177 -0.26838206 -0.06415295]
# [ 0. 0. 0. 1. ]]

# additional camera parameters
camera_parameters:
    timestamp_tolerance: 0.005 # [s] stereo frame out-of-sync tolerance
    sync_cameras: [0] # the cameras that will be synchronised
    image_delay: 0.0297405129318     # [s] timestamp_camera_correct = timestamp_camera - image_delay
    online_calibration: # some parameters to set the online
        do_extrinsics: false # Do we online-calibrate extrinsics?
        do_extrinsics_final_ba: false # Do we calibrate extrinsics in final BA?
        sigma_r: 0.01 # T_SCi position prior stdev [m]
        sigma_alpha: 0.1 # T_SCi orientation prior stdev [rad]
        sigma_r_final_ba: 0.03 # T_SCi position prior stdev in final BA [m]
        sigma_alpha_final_ba: 0.3 # T_SCi orientation prior stdev in final BA [rad]
    # deep_stereo_indices: [0,1] # [left, right] camera indices for the stereo network
    # fov_scale: 1.0 # Divisor for new focal length which is only used when fisheye stereo rectification for dense mapping.
imu_parameters:
    use: true
    a_max: 176.0 # acceleration saturation [m/s^2]
    g_max: 7.8 # gyro saturation [rad/s]
    sigma_g_c: 0.004 # gyro noise density [rad/s/sqrt(Hz)]
    sigma_a_c: 0.08 # accelerometer noise density [m/s^2/sqrt(Hz)]
    sigma_bg: 0.0001 # gyro bias prior [rad/s]
    sigma_ba: 0.001 # accelerometer bias prior [m/s^2]
    sigma_gw_c: 0.0001 # gyro drift noise density [rad/s^s/sqrt(Hz)]
    sigma_aw_c: 0.00004 # accelerometer drift noise density [m/s^2/sqrt(Hz)]
    g: 9.803 # Earth's acceleration due to gravity [m/s^2]
    g0: [ 0.0, 0.0, 0.0 ] # initial gyro bias [rad/s]
    a0: [ 0.0, 0.0, 0.01 ] # initial accelerometer bias [m/s^2]
    s_a: [ 1.0,  1.0, 1.0 ] # scale factor for accelerometer measurements: a_true = s_a * a_meas + b_a
    # transform Body-Sensor (IMU)
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]

# frontend: detection etc.
frontend_parameters:
    detection_threshold: 40.0 #42.0 # detection threshold. By default the uniformity radius in pixels
    absolute_threshold: 150.0 # absolute Harris corner threshold (noise floor)
    matching_threshold: 60.0 # BRISK descriptor matching threshold
    octaves: 1 # number of octaves for detection. 0 means single-scale at highest resolution
    max_num_keypoints: 1000 # restrict to a maximum of this many keypoints per image (strongest ones)
    keyframe_overlap: 0.30 # minimum field-of-view overlap
    use_cnn: false # use the CNN (if available) to filter out dynamic content / sky
    parallelise_detection: true # Run parallel detect & describe.
    num_matching_threads: 4 # Parallelise matching with this number of threads.

    # detection_threshold: 70.0 #42.0 # detection threshold. By default the uniformity radius in pixels
    # absolute_threshold: 150.0 # absolute Harris corner threshold (noise floor)
    # matching_threshold: 150.0 # BRISK descriptor matching threshold
    # octaves: 0 # number of octaves for detection. 0 means single-scale at highest resolution
    # max_num_keypoints: 500 # restrict to a maximum of this many keypoints per image (strongest ones)
    # keyframe_overlap: 0.30 # minimum field-of-view overlap
    # use_cnn: false # use the CNN (if available) to filter out dynamic content / sky
    # parallelise_detection: false # Run parallel detect & describe.
    # num_matching_threads: 4 # Parallelise matching with this number of threads.

# estimator parameters
estimator_parameters:
    num_keyframes: 5 # number of keyframes in optimisation window
    num_loop_closure_frames: 3 # number of loop closure frames in optimisation window
    num_imu_frames: 3 # number of frames linked by most recent nonlinear IMU error terms
    do_loop_closures: false # whether to do VI-SLAM or VIO
    do_final_ba: true # Whether to run a full final BA
    enforce_realtime: false # whether to limit the time budget for optimisation
    realtime_min_iterations: 3 # minimum number of iterations always performed
    realtime_max_iterations: 10 # never do more than these, even if not converged
    realtime_time_limit: 0.035 # time budget for realtime optimisation [s]
    realtime_num_threads: 3 # number of threads for the realtime optimisation
    full_graph_iterations: 15 # don't do more than these for the full (background) optimisation
    full_graph_num_threads: 3 # number of threads for the full (background) optimisation
    p_dbow: 0.4 # Match threshold for dBoW -- unfortunately this varies with setups.
    drift_percentage_heuristic: 1.35 # % allowed drift in loop closures rel. to dist. travelled.

# gps_parameters:
#     data_type: cartesian
#      #eodetic
#     r_SA: [0.0, 0.0, 0.01]
#     yaw_error_threshold: 0.5 # Threshold on yaw observability to freeze the optimization of the extrinsics (to enable the global alignment strategies mentioned in the paper)
#     robust_gps_init: false # Use a robustified version of the Initialization (might be needed for low-grade GPS sensor measurements)

# some options for how and what to output
output_parameters:
    display_topview: true # Displays top view of the trajectory. Might become slow for long sequences.
    display_matches: true  # displays debug video and matches. May be slow.
    display_overhead: false # debug overhead image. Is slow.
    enable_submapping: false # Enable volumetric submapping
